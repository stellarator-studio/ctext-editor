<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scan Image Test</title>
</head>
<body>
  <header>
    <h1>原典圖片載入測試 <small>M0 spike</small></h1>
    <nav><a href="./index.html">← 編輯器</a></nav>
  </header>

  <section class="panel">
    <p class="muted">只有按下「載入」時才會向圖片網站發出<strong>一次</strong>請求，不預取、不批次下載。
      目的：確認從本站（gh-pages）以 <code>&lt;img&gt;</code> 顯示 cText 圖書館圖片是否被擋（hotlink / Referer 檢查）。</p>
    <div class="row">
      範例：
      <button data-url="https://library.ctext.org/h0005527/h0005527_0092.jpg" data-page="92">嘉定縣志 p.92</button>
      <button data-url="https://library.ctext.org/02087094.cn/02087094.cn_0008.png" data-page="8">海國圖志 p.8</button>
    </div>
    <div class="grid">
      <label>範例圖片網址 <input id="exUrl" size="70" /></label>
      <label>該圖片的頁碼 <input id="exPage" type="number" min="0" /></label>
      <button id="infer">推算樣板</button>
      <label>樣板 <input id="template" size="70" placeholder="https://…_{page:4}.jpg" /></label>
      <label>要載入的頁碼 <input id="page" type="number" min="0" /></label>
      <label>頁碼位移 <input id="offset" type="number" value="0" /></label>
      <label>Referrer policy
        <select id="referrer">
          <option value="no-referrer">no-referrer</option>
          <option value="">（瀏覽器預設，會送出本站網址）</option>
        </select>
      </label>
    </div>
    <div class="row">
      <button id="loadImg">載入</button>
      <span id="imgStatus"></span>
    </div>
    <p id="resolved" class="muted"></p>
    <ul id="log" class="log"></ul>
    <div id="imgBox" class="imgbox"></div>
  </section>

  <script type="module" src="/src/spike/imageTest.ts"></script>
</body>
</html>
